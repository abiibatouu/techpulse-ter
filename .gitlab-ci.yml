stages:
  - lint
  - test

lint:python:
  stage: lint
  image: python:3.9
  script:
    - pip install flake8
    - flake8 ingestion/ --max-line-length=120 --ignore=E501 || true
  allow_failure: true

test:schema:
  stage: test
  image: python:3.9
  script:
    - python test_schema.py
  allow_failure: false
