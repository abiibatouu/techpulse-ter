services:
  postgres:
    image: postgres:15-alpine
    container_name: techpulse_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-techpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ingestion/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techpulse_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: techpulse_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-abibatou@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - techpulse_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  dashboard:
    build: .
    container_name: techpulse_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le reseau Docker, la base est joignable au nom du service,
      # pas sur localhost. On surcharge donc DB_HOST/DB_PORT du .env.
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8501:8501"
    volumes:
      # Code monte en direct dans le conteneur : apres une modif, un simple
      # `docker compose restart dashboard` suffit, plus besoin de reconstruire.
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techpulse_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  techpulse_network:
    driver: bridge
